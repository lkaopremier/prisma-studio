services:
  prisma-studio:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=$DATABASE_URL
      - AUTH_USER=$AUTH_USER
      - AUTH_PASSWORD=$AUTH_PASSWORD
      - SESSION_SECRET=$SESSION_SECRET
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
